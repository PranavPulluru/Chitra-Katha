<svg viewBox="0 0 1044 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Chitra Katha technology stack</title>
<desc>Five-stage pipeline: TensorFlow.js with Teachable Machine, a custom PyTorch CNN, the Leaflet Folk Atlas, a Siamese neural network that scores drawing accuracy, and a globe representing six-language localization.</desc>

