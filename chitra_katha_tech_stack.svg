  <text x="90" y="150" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7d7d82">in-browser classifier</text>
</g>

<g transform="translate(236,70)">
  <rect width="180" height="160" rx="16" fill="#1a1a1d" stroke="#2c2c30" stroke-width="1.5"/>
  <circle cx="90" cy="52" r="32" fill="#232326"/>
